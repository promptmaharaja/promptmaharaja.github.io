<!DOCTYPE html>
<html>
<head>

<style>
body{

font-family:Arial,sans-serif;

}
.box{
background:#111;
border:1px solid #FFD700;
border-radius:15px;
padding:20px;

max-width:700px;
}
a{

}
textarea{
width:90%;

<body>

<h1>💼 Modern Office Woman</h1>

<div class="box">

<textarea readonly>
Confident modern businesswoman, professional office attire, elegant appearance, corporate office background, natural pose, cinematic lighting, ultra realistic photography, detailed facial features, luxury corporate aesthetic, professional portrait, masterpiece quality, highly detailed, 8k resolution.

<script>
function copyPrompt() {
const promptText = document.querySelector("textarea").value;

}
</script>

</html>
